name: arcane_ops
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Theme
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  google_fonts: ^6.1.0

  # Firebase
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  firebase_messaging: ^15.2.4

  # Utilities
  image_picker: ^1.1.2
  flutter_local_notifications: ^18.0.1
  intl: ^0.19.0
  email_validator: ^3.0.0 # 👈 Ajouté pour corriger la validation d'email
  uuid: ^4.5.1            # 👈 Ajouté pour corriger la génération d'identifiants

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Section Assets (Commentée tant que les fichiers ne sont pas sur GitHub)
