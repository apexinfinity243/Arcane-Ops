name: arcane_ops
description: Arcane-Ops - Flutter Authentication & Messaging App with Matrix Hacker Style

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.24.0
  firebase_auth: ^4.14.0
  cloud_firestore: ^4.13.0
  firebase_storage: ^11.5.0
  firebase_messaging: ^14.6.0
  get: ^4.6.5
  uuid: ^4.0.0
  image_picker: ^1.0.4
  
dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.14.0
  firebase_firestore: ^4.14.0
  firebase_storage: ^11.5.0

  # UI & Navigation
  get: ^4.6.5
  flutter_spinkit: ^5.2.0
  intl: ^0.19.0
  intl_phone_number_input: ^0.7.2
  country_picker: ^2.0.23

  # State Management
  provider: ^6.1.0

  # Validation
  email_validator: ^3.0.0

  # Animations & Effects
  animated_background: ^2.0.2
  lottie: ^2.6.0

  # Utils
  uuid: ^4.0.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
